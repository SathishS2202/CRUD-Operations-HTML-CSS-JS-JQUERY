<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h4 class="display-5 py-2 border-bottom">Fruit Shop</h4>
                <form action="" id="formSubmit">
                    <div class="mb-3">
                        <label for="fruit"  class="form-label">Fruits</label>
                        <input type="text" class="form-control" name="fruit" placeholder="Enter Fruit Name">
                    </div>
                    <div class="mb-3">
                        <label for="qty"   class="form-label">Quantity</label>
                        <input type="text" name= "qty" class="form-control" placeholder="Enter Quantity">
                    </div>
                    <div>
                        <button class="btn btn-primary"  type="submit">Add Fruit</button>
                        <button class="btn btn-secondary" type="reset">Remove Fruit</button>
                    </div>
                </form>
                <hr>
                <table class="table table-bordered ">
                    <thead>
                        <tr>
                            <th>Sno</th>
                            <th>Fruit</th>
                            <th>Quantity</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
    $("#formSubmit").submit(function(e) {
        e.preventDefault();
        
        const fruit = e.target.fruit.value;
        const qty = e.target.qty.value;

        if (!qty || !fruit) {
            alert("Enter all details");
            return;
        }

        const obj = { id: Date.now(), fruit, qty };

        const fruits = JSON.parse(localStorage.getItem("fruits")) || [];
        fruits.push(obj);
        localStorage.setItem("fruits", JSON.stringify(fruits));

        loadfruits();
        e.target.reset();
    });

    function loadfruits() {
        const fruits = JSON.parse(localStorage.getItem("fruits")) || [];
        $("tbody").html(""); // Clear old rows

        fruits.forEach((item, index) => {
            const tr = `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.fruit}</td>
                    <td>${item.qty}</td>
                    <td>
                        <button class="btn btn-danger btn-sm deleteBtn" data-id="${item.id}">Delete</button>
                    </td>
                </tr>
            `;
            $("tbody").append(tr);
        });
    }

    $(document).on("click", ".deleteBtn", function () {
        const id = $(this).data("id"); 

        let fruits = JSON.parse(localStorage.getItem("fruits")) || [];
        fruits = fruits.filter(item => item.id != id);

        localStorage.setItem("fruits", JSON.stringify(fruits));

        loadfruits(); 
    });

    loadfruits(); // initial load
</script>

</body>
</html>
