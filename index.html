<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        #topMessage {
            position: fixed;
            top: 10px;
            transform: translateX(-50%);
            background: green;
            left:50%;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            display: none;
            z-index: 1000;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 3px;
        }

        #editPanel {
            width: 300px;
            height: 100%;
            background: white;
            box-shadow: -2px 0 8px rgba(0,0,0,0.2);
            position: fixed;
            top: 0;
            right: -320px;
            padding: 20px;
            transition: 0.4s;
            z-index: 2000;
        }

        #editPanel.open {
            right: 0;
        }

        .expandText {
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div id="topMessage"></div>

    <div id="editPanel">
        <h5>Edit Fruit</h5>
        <hr>

        <input type="hidden" id="editId">

        <label>Fruit Name</label>
        <input type="text" id="editFruit" class="form-control">
        <div id="editFruitError" class="error"></div>

        <label class="mt-3">Quantity</label>
        <input type="text" id="editQty" class="form-control">
        <div id="editQtyError" class="error"></div>

        <button id="updateBtn" class="btn btn-primary mt-3 w-100">Update</button>
        <button id="closePanel" class="btn btn-secondary mt-2 w-100">Close</button>
    </div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-7">
                
                <h4 class="display-6 py-2 border-bottom">Fruit Shop</h4>

                <form id="formSubmit">
                    <div class="mb-3">
                        <label class="form-label">Fruit Name</label>
                        <input type="text" name="fruit" class="form-control">
                        <div id="fruitError" class="error"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="text" name="qty" class="form-control">
                        <div id="qtyError" class="error"></div>
                    </div>

                    <button class="btn btn-primary" type="submit">Save</button>
                </form>

                <hr>

                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Sno</th>
                            <th>Fruit</th>
                            <th>Qty</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>

            </div>
        </div>
    </div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>

function showTopMessage(msg) {
    $("#topMessage").text(msg).fadeIn();

    setTimeout(() => $("#topMessage").fadeOut(), 2500);
}

$("#formSubmit").submit(function(e) {
    e.preventDefault();

    const fruit = e.target.fruit.value.trim();
    const qty = e.target.qty.value.trim();

    $("#fruitError").text("");
    $("#qtyError").text("");

    let isValid = true;

    if (!fruit) {
        $("#fruitError").text("Fruit name is required");
        isValid = false;
    } 
    else if (!/^[A-Za-z ]+$/.test(fruit)) {
        $("#fruitError").text("Fruit name must contain only letters");
        isValid = false;
    }
    else if (fruit.length > 12) {
        $("#fruitError").text("Maximum 12 letters allowed");
        isValid = false;
    }

    if (!qty) {
        $("#qtyError").text("Quantity is required");
        isValid = false;
    } 
    else if (!/^[0-9]+$/.test(qty)) {
        $("#qtyError").text("Quantity must be numbers only");
        isValid = false;
    } 
    else if (parseInt(qty) <= 0) {
        $("#qtyError").text("Quantity must be greater than 0");
        isValid = false;
    }

    if (!isValid) return;

    const fruits = JSON.parse(localStorage.getItem("fruits")) || [];
    fruits.push({ id: Date.now(), fruit, qty });
    localStorage.setItem("fruits", JSON.stringify(fruits));

    showTopMessage("Fruit Added Successfully!");
    loadFruits();
    e.target.reset();
});

function loadFruits() {
    const fruits = JSON.parse(localStorage.getItem("fruits")) || [];
    $("tbody").html("");

    fruits.forEach((item, index) => {
        let shortText = item.fruit.length > 8 ? item.fruit.substring(0, 8) + "..." : item.fruit;

        const row = `
            <tr>
                <td>${index + 1}</td>
                <td class="expandText" data-full="${item.fruit}">${shortText}</td>
                <td>${item.qty}</td>
                <td>
                    <button class="btn btn-warning btn-sm editBtn" data-id="${item.id}">Edit</button>
                    <button class="btn btn-danger btn-sm deleteBtn" data-id="${item.id}">Delete</button>
                </td>
            </tr>`;
        $("tbody").append(row);
    });
}

$(document).on("click", ".expandText", function() {
    let full = $(this).data("full");
    let text = $(this).text();

    if (text.endsWith("...")) {
        $(this).text(full);
    } else {
        $(this).text(full.substring(0, 8) + "...");
    }
});

$(document).on("click", ".deleteBtn", function() {
    let id = $(this).data("id");
    let fruits = JSON.parse(localStorage.getItem("fruits")) || [];
    fruits = fruits.filter(f => f.id != id);
    localStorage.setItem("fruits", JSON.stringify(fruits));
    loadFruits();
    showTopMessage("Deleted Successfully!");
});

$(document).on("click", ".editBtn", function() {
    let id = $(this).data("id");
    let fruits = JSON.parse(localStorage.getItem("fruits")) || [];
    let item = fruits.find(f => f.id == id);

    $("#editId").val(id);
    $("#editFruit").val(item.fruit);
    $("#editQty").val(item.qty);

    $("#editPanel").addClass("open");
});

$("#closePanel").click(() => $("#editPanel").removeClass("open"));

$("#updateBtn").click(function() {

    const f = $("#editFruit").val().trim();
    const q = $("#editQty").val().trim();

    $("#editFruitError").text("");
    $("#editQtyError").text("");

    let ok = true;

    if (!/^[A-Za-z ]+$/.test(f) || f.length > 12 || !f) {
        $("#editFruitError").text("Invalid fruit name");
        ok = false;
    }
    if (!/^[0-9]+$/.test(q) || parseInt(q) <= 0) {
        $("#editQtyError").text("Invalid quantity");
        ok = false;
    }

    if (!ok) return;

    let id = $("#editId").val();
    let fruits = JSON.parse(localStorage.getItem("fruits")) || [];

    fruits = fruits.map(item =>
        item.id == id ? { ...item, fruit: f, qty: q } : item
    );

    localStorage.setItem("fruits", JSON.stringify(fruits));

    $("#editPanel").removeClass("open");
    loadFruits();
    showTopMessage("Updated Successfully!");
});

loadFruits();
</script>

</body>
</html>
